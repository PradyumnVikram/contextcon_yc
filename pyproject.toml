[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clearance"
version = "0.1.0"
description = "Autonomous export-compliance agent (ContextCon hackathon)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Person A: data and risk signals
data = [
    "httpx>=0.27",
    "pandas>=2.0",
    "rapidfuzz>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# Person B: agent, LLM and product
product = [
    "httpx>=0.27",        # local LLM (Ollama) client
    "anthropic",          # optional: CLEARANCE_LLM=claude
    "streamlit>=1.35",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["clearance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
